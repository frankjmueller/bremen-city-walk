name: build-check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Generated output (index.html, teens.html, sw.js) must match the
      # sources in content/ + templates/. If this fails:
      # run `node build.mjs` locally and commit the result.
      - run: node build.mjs --check
